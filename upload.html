<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partagez vos photos</title>
<style>
  :root {
    --accent: #b08968;
    --bg: #faf6f1;
    --text: #3a2e2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .logo {
    max-width: 160px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin: 8px 0 4px;
  }
  .names {
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 24px;
    text-align: center;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    text-align: center;
  }
  input[type="file"] {
    display: none;
  }
  label.upload-btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 1rem;
    margin-bottom: 16px;
  }
  #fileList {
    text-align: left;
    font-size: 0.85rem;
    margin-bottom: 16px;
    max-height: 140px;
    overflow-y: auto;
  }
  button#sendBtn {
    background: var(--text);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }
  button#sendBtn:disabled {
    opacity: 0.5;
  }
  .progress {
    margin-top: 16px;
    font-size: 0.9rem;
  }
  .success {
    color: #4a7c59;
    font-weight: bold;
    margin-top: 16px;
  }
  .error {
    color: #b03a2e;
    margin-top: 16px;
    font-size: 0.9rem;
  }
  footer {
    margin-top: auto;
    padding-top: 32px;
    font-size: 0.75rem;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

  <img class="logo" id="logoImg" src="" alt="" style="display:none;">
  <h1>Un souvenir de leur mariage</h1>
  <div class="names" id="namesDisplay"></div>

  <div class="card">
    <p>Déposez vos plus belles photos de la soirée, elles rejoindront directement l'album des mariés.</p>
    <label class="upload-btn" for="fileInput">📷 Choisir des photos</label>
    <input type="file" id="fileInput" accept="image/*" multiple capture="environment">
    <div id="fileList"></div>
    <button id="sendBtn" disabled>Envoyer</button>
    <div class="progress" id="progressText"></div>
    <div class="success" id="successText" style="display:none;">Merci ! Vos photos ont bien été envoyées 💛</div>
    <div class="error" id="errorText" style="display:none;"></div>
  </div>

  <footer>Album sécurisé — propulsé par [Ton Entreprise]</footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

    // ⚠️ Remplace par la config de TON projet Firebase (Paramètres du projet > Général > Vos applications)
    const firebaseConfig = {
      apiKey: "AIzaSyChe0fQwj8G_FLissRzoxu7NdJJsq_C9d4",
      authDomain: "qr-code-mariage.firebaseapp.com",
      projectId: "qr-code-mariage",
      storageBucket: "qr-code-mariage.firebasestorage.app",
      messagingSenderId: "811526969611",
      appId: "1:811526969611:web:c86102da53b5576aa66a0e"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    // Récupère l'identifiant du mariage et les noms depuis le lien (ex: upload.html?id=dupont-martin&names=Julie%20%26%20Marc)
    const params = new URLSearchParams(window.location.search);
    const weddingId = params.get("id");
    const names = params.get("names");
    const logo = params.get("logo");

    if (names) document.getElementById("namesDisplay").textContent = names;
    if (logo) {
      const logoImg = document.getElementById("logoImg");
      logoImg.src = logo;
      logoImg.style.display = "block";
    }

    const fileInput = document.getElementById("fileInput");
    const fileListEl = document.getElementById("fileList");
    const sendBtn = document.getElementById("sendBtn");
    const progressText = document.getElementById("progressText");
    const successText = document.getElementById("successText");
    const errorText = document.getElementById("errorText");

    let selectedFiles = [];

    if (!weddingId) {
      errorText.style.display = "block";
      errorText.textContent = "Lien invalide : identifiant du mariage manquant.";
      sendBtn.disabled = true;
      fileInput.disabled = true;
    }

    fileInput.addEventListener("change", () => {
      selectedFiles = Array.from(fileInput.files);
      fileListEl.innerHTML = selectedFiles.map(f => `• ${f.name}`).join("<br>");
      sendBtn.disabled = selectedFiles.length === 0;
    });

    sendBtn.addEventListener("click", async () => {
      sendBtn.disabled = true;
      errorText.style.display = "none";
      let done = 0;

      for (const file of selectedFiles) {
        try {
          progressText.textContent = `Envoi de la photo ${done + 1} sur ${selectedFiles.length}...`;
          const path = `albums/${weddingId}/${Date.now()}_${file.name}`;
          await uploadBytes(ref(storage, path), file);
          done++;
        } catch (e) {
          errorText.style.display = "block";
          errorText.textContent = "Une erreur est survenue pendant l'envoi. Vérifiez votre connexion et réessayez.";
          sendBtn.disabled = false;
          return;
        }
      }

      progressText.textContent = "";
      successText.style.display = "block";
      fileListEl.innerHTML = "";
      selectedFiles = [];
      fileInput.value = "";
    });
  </script>
</body>
</html>
